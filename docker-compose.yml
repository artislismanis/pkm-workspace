services:
  pkm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pkm-sandbox
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "${TTYD_PORT:-7681}:7681"
    volumes:
      - .:/workspace
      - ${PKM_VAULT_PATH:-./vault}:/workspace/vault
      - pkm-claude-config:/home/claude/.claude
      - pkm-atuin-history:/home/claude/.local/share/atuin
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-}
      - TERM=xterm-256color
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7681/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # ── Optional: ttyd authentication ──
    # To enable, override the default CMD:
    #   command: ["ttyd", "-W", "-p", "7681", "--credential", "user:${TTYD_PASSWORD:-changeme}", "tmux", "new-session", "-A", "-s", "main"]
    # Then set TTYD_PASSWORD in your .env file and configure
    # matching credentials in the Obsidian plugin settings.
    #
    # ── Optional: resource limits ──
    # deploy:
    #   resources:
    #     limits:
    #       memory: 4G
    #       cpus: "2.0"

volumes:
  pkm-claude-config:
  pkm-atuin-history:
